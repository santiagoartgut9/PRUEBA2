name: Claude Issue Triage & Fix

on:
  issues:
    types: [opened, edited]

# Si el issue se edita varias veces seguidas, solo nos interesa la última ejecución.
concurrency:
  group: claude-issue-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1) Diagnóstico + labels. Se ejecuta para cualquier autor, con herramientas
  #    de solo lectura (más gh issue edit para los labels).
  # ---------------------------------------------------------------------------
  triage:
    # - opened: siempre.
    # - edited: solo si cambió el título o el cuerpo (no por milestone, assignees, etc.).
    # - Se ignoran eventos disparados por bots para evitar bucles.
    if: |
      github.event.sender.type != 'Bot' &&
      (
        github.event.action == 'opened' ||
        (github.event.action == 'edited' && (github.event.changes.title != null || github.event.changes.body != null))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read   # Leer el código para diagnosticar
      issues: write    # Asignar labels y comentar
      id-token: write  # Requerido por claude-code-action
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Preparar directorio de salida
        run: mkdir -p .claude-output

      - name: Run Claude Code (diagnóstico y labels)
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

          # Cualquiera puede abrir un issue. Es aceptable porque en este job Claude solo
          # lee código, gestiona labels y escribe el diagnóstico en un archivo local.
          allowed_non_write_users: '*'

          # Las instrucciones viven en Markdown versionado (.github/claude/triage.md).
          # El título/cuerpo del issue NO se interpolan aquí: Claude los lee con `gh`.
          prompt: |
            Lee y sigue al pie de la letra las instrucciones de `.github/claude/triage.md`.

            REPO: ${{ github.repository }}
            ISSUE_NUMBER: ${{ github.event.issue.number }}
            EVENT: ${{ github.event.action }}
            SHA: ${{ github.sha }}

          claude_args: |
            --allowedTools "Read,Glob,Grep,Write,Bash(gh issue view:*),Bash(gh label list:*),Bash(gh issue edit:*)"

      # El comentario lo publica el workflow (no Claude) con --body-file, para que el
      # Markdown llegue intacto a GitHub, sin problemas de escapado en la shell.
      - name: Publicar diagnóstico en el issue
        run: |
          if [ ! -s .claude-output/diagnosis.md ]; then
            echo "::warning::Claude no generó .claude-output/diagnosis.md"
            exit 0
          fi
          bash .github/scripts/upsert-issue-comment.sh "$ISSUE_NUMBER" '<!-- claude-triage -->' .claude-output/diagnosis.md

  # ---------------------------------------------------------------------------
  # 2) Implementación + rama + PR hacia la rama principal. Solo para issues
  #    abiertos por personas de confianza, porque aquí Claude escribe código.
  # ---------------------------------------------------------------------------
  implement:
    needs: triage
    if: contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write       # Push de la rama
      pull-requests: write  # Crear / actualizar la PR
      issues: write         # Comentar si no se implementa
      id-token: write       # Requerido por claude-code-action
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      BRANCH: claude/issue-${{ github.event.issue.number }}
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Rama determinista por issue: si el issue se edita, se reutiliza la misma rama/PR.
      - name: Preparar rama de trabajo
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p .claude-output
          echo ".claude-output/" >> .git/info/exclude

          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            git fetch --depth 1 origin "$BRANCH"
            git checkout -B "$BRANCH" FETCH_HEAD
          else
            git checkout -b "$BRANCH"
          fi
          # Refspec explícito para que exista origin/<base> (Claude lo usa para comparar).
          git fetch --depth 1 origin "${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}"

      - name: Run Claude Code (implementación)
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

          prompt: |
            Lee y sigue al pie de la letra las instrucciones de `.github/claude/implement.md`.

            REPO: ${{ github.repository }}
            ISSUE_NUMBER: ${{ github.event.issue.number }}
            EVENT: ${{ github.event.action }}
            BRANCH: ${{ env.BRANCH }}
            BASE_BRANCH: ${{ env.BASE_BRANCH }}

          # Claude edita archivos y verifica, pero NO tiene git commit/push:
          # eso lo hace el paso siguiente de forma determinista.
          claude_args: |
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(gh issue view:*),Bash(node --check:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*)"

      - name: Commit, push y Pull Request
        run: |
          set -euo pipefail
          git add -A

          TITLE="$(head -n 1 .claude-output/pr-title.txt 2>/dev/null || true)"

          if ! git diff --cached --quiet; then
            # Barrera de seguridad: nunca publicar cambios en workflows/scripts/prompts.
            if git diff --cached --name-only | grep -q '^\.github/'; then
              echo "::error::Claude modificó archivos dentro de .github/; no se publican por seguridad."
              git diff --cached --name-only
              exit 1
            fi

            [ -n "$TITLE" ] || TITLE="fix: resolver issue #${ISSUE_NUMBER}"
            git commit -m "$TITLE" -m "Closes #${ISSUE_NUMBER}"
            git push origin "HEAD:refs/heads/${BRANCH}"
          else
            echo "Claude no hizo cambios de código nuevos en esta ejecución."
          fi

          # La PR se decide por el estado de la rama remota, no por si hubo commit en esta
          # ejecución: así un re-run (p. ej. tras un fallo al crear la PR) la crea igualmente.
          # Se usa la API compare porque el clon es superficial (fetch-depth: 1).
          AHEAD=0
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            AHEAD="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BASE_BRANCH}...${BRANCH}" --jq '.ahead_by')"
          fi

          if [ "$AHEAD" -eq 0 ]; then
            echo "La rama no tiene cambios respecto a ${BASE_BRANCH}; no se crea PR."
            if [ -s .claude-output/skip-reason.md ]; then
              bash .github/scripts/upsert-issue-comment.sh "$ISSUE_NUMBER" '<!-- claude-implement -->' .claude-output/skip-reason.md
            fi
            exit 0
          fi

          [ -n "$TITLE" ] || TITLE="$(git log -1 --format=%s)"

          { cat .claude-output/pr-body.md 2>/dev/null || true; printf '\n\n---\n\nCloses #%s\n' "$ISSUE_NUMBER"; } > .claude-output/pr-full-body.md

          PR_NUMBER="$(gh pr list --head "$BRANCH" --base "$BASE_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$PR_NUMBER" ]; then
            gh pr edit "$PR_NUMBER" --title "$TITLE" --body-file .claude-output/pr-full-body.md
            echo "PR #${PR_NUMBER} actualizada."
          else
            gh pr create --base "$BASE_BRANCH" --head "$BRANCH" --title "$TITLE" --body-file .claude-output/pr-full-body.md
          fi
