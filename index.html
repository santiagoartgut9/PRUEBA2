<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <button id="theme-btn" type="button" aria-label="Cambiar tema">☀️ Claro</button>

  <div class="wrapper">
    <h1 class="title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section">
          <label class="label" for="skin-select">SKIN</label>
          <!-- Las opciones se generan desde SKINS (skins.js) -->
          <select id="skin-select" class="skin-select">
            <option value="retro">Retro</option>
          </select>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd><kbd>X</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd><kbd>Esc</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>

        <!-- Tabla de records (gestionada por records.js) -->
        <div id="records" class="records hidden">
          <p id="records-stats" class="records-stats"></p>
          <form id="records-form" class="records-form hidden" autocomplete="off">
            <label for="records-name" id="records-form-label" class="records-new">¡Nuevo récord!</label>
            <div class="records-form-row">
              <input id="records-name" type="text" maxlength="12" placeholder="Tu nombre" spellcheck="false" />
              <button type="submit" class="btn-secondary">Guardar</button>
            </div>
          </form>
          <span class="label">TOP 5</span>
          <table class="records-table">
            <thead>
              <tr><th>#</th><th>Nombre</th><th>Puntos</th><th>Líneas</th><th>Combo</th></tr>
            </thead>
            <tbody id="records-body"></tbody>
          </table>
          <p id="records-best" class="records-best"></p>
          <button type="button" id="records-reset" class="btn-link">Resetear records</button>
        </div>

        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="pause-menu" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="pm-title">
      <div class="overlay-box pause-box">
        <p id="pm-title">PAUSA</p>
        <button id="pm-resume" class="pm-btn pm-primary" type="button">Reanudar</button>
        <button id="pm-restart" class="pm-btn" type="button">Reiniciar</button>
        <button id="pm-controls-btn" class="pm-btn" type="button" aria-expanded="false" aria-controls="pm-controls">Ver controles</button>
        <ul id="pm-controls" class="pm-controls hidden">
          <li><kbd>←</kbd><kbd>→</kbd> mover</li>
          <li><kbd>↑</kbd>/<kbd>X</kbd> rotar</li>
          <li><kbd>↓</kbd> bajar</li>
          <li><kbd>Space</kbd> caída</li>
          <li><kbd>P</kbd>/<kbd>Esc</kbd> pausa</li>
        </ul>
        <label class="pm-level" for="pm-start-level">
          <span class="label">NIVEL INICIAL</span>
          <select id="pm-start-level"></select>
        </label>
        <p class="pm-hint">Se aplica en la próxima partida</p>
      </div>
    </div>
  </div>

  <!-- skins.js debe cargarse antes que game.js: define SKINS y DEFAULT_SKIN -->
  <script src="skins.js"></script>
  <script src="game.js"></script>
  <script src="pause-menu.js"></script>
  <script src="records.js"></script>
</body>
</html>
