<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <button id="theme-btn" type="button" aria-label="Cambiar tema">☀️ Claro</button>

  <div class="wrapper">
    <h1 class="title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd><kbd>X</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd><kbd>Esc</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="pause-menu" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="pause-title">
      <div class="overlay-box">
        <div id="menu-main" class="menu-view">
          <p id="pause-title" class="menu-title">PAUSA</p>
          <button type="button" class="menu-btn primary" data-action="resume">Reanudar</button>
          <button type="button" class="menu-btn" data-action="restart">Reiniciar</button>
          <button type="button" class="menu-btn" data-action="controls">Ver controles</button>
          <label class="menu-field">
            <span class="label">NIVEL INICIAL</span>
            <select id="start-level"></select>
          </label>
          <p class="menu-hint">Se aplica a la próxima partida</p>
        </div>

        <div id="menu-controls" class="menu-view hidden">
          <p class="menu-title">CONTROLES</p>
          <!-- Se rellena desde la lista del panel lateral para no duplicarla -->
          <ul id="menu-controls-list" class="menu-controls-list"></ul>
          <button type="button" class="menu-btn" data-action="back">Volver</button>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
